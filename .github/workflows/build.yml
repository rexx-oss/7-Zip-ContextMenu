name: Build 7-Zip-ContextMenu Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Cascading COM DLL
        run: |
          cl.exe /LD /O2 /EHsc SevenZipCommand.cpp /link /DEF:SevenZipCommand.def /OUT:SevenZipCommand.dll shlwapi.lib shell32.lib ole32.lib user32.lib advapi32.lib

      - name: Package and Sign
        shell: powershell
        run: |
          # 1. Temporary folder for makeappx packaging
          New-Item -ItemType Directory -Path appx_staging/Assets -Force | Out-Null
          Copy-Item AppxManifest.xml appx_staging/
          Copy-Item SevenZipCommand.dll appx_staging/
          Copy-Item "C:\Program Files\7-Zip\7zFM.exe" appx_staging/7zFM.exe

          # Extract authentic 7-Zip icon for the MSIX visual elements
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("C:\Program Files\7-Zip\7zFM.exe")
          $bmp = $icon.ToBitmap()

          $sizes = @{ "appx_staging/Assets/Square44x44Logo.png" = 44; "appx_staging/Assets/Square150x150Logo.png" = 150; "appx_staging/Assets/StoreLogo.png" = 50 }
          foreach ($path in $sizes.Keys) {
              $dim = $sizes[$path]
              $resized = New-Object System.Drawing.Bitmap $dim, $dim
              $g = [System.Drawing.Graphics]::FromImage($resized)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
              $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
              $g.DrawImage($bmp, 0, 0, $dim, $dim)
              $g.Dispose()
              $resized.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $resized.Dispose()
          }
          $bmp.Dispose()
          $icon.Dispose()

          # 2. Output folder with ONLY the final installation files
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          # Certificate
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=rexx" `
            -KeyUsage DigitalSignature `
            -FriendlyName "rexx" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          $certBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes("dist/7-Zip-ContextMenu.cer", $certBytes)

          # Pack & Sign MSIX directly into dist
          $kitBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" | Select-Object -Last 1).FullName
          & "$kitBin\makeappx.exe" pack /d appx_staging /p dist/SevenZipMenu.msix /nv
          & "$kitBin\signtool.exe" sign /fd SHA256 /a /s My /n "rexx" dist/SevenZipMenu.msix

          # Add installer scripts
          Copy-Item install.ps1 dist/
          Copy-Item uninstall.ps1 dist/

      # Upload the dist folder directly (GitHub zips it once, no zip inside a zip)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7-Zip-ContextMenu
          path: dist/
